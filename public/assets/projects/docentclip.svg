  <text x="300" y="558" font-size="22" text-anchor="middle">🎙</text>
  <text x="300" y="598" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">Enregistra</text>
  <text x="300" y="616" font-size="13" fill="#6b7280" text-anchor="middle">Veu, nota ràpida</text>
  <text x="300" y="632" font-size="13" fill="#6b7280" text-anchor="middle">o entrevista fins 30'</text>

