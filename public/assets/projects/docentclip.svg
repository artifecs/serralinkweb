  <text x="950" y="358" font-size="11" fill="#6b7280">Incident entre alumnes resolts correctament...</text>
  <rect x="1220" y="325" width="62" height="18" rx="9" fill="rgba(245,158,11,0.1)"/>
  <text x="1251" y="338" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="700">En procés</text>
  <text x="950" y="378" font-size="10" fill="#9ca3af">Dilluns, 12:01 · 0m 45s</text>

