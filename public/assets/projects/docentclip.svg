  <text x="920" y="632" font-size="13" fill="#6b7280" text-anchor="middle">i enviable per email</text>

  <!-- Arrow -->
  <line x1="1000" y1="550" x2="1150" y2="550" stroke="#d4d6f0" stroke-width="2"/>
  <polyline points="1142,544 1150,550 1142,556" fill="none" stroke="#d4d6f0" stroke-width="2"/>

