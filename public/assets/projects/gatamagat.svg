  <ellipse cx="788" cy="560" rx="60" ry="100" fill="rgba(220,210,190,0.2)"/>
  <text x="760" y="530" font-size="14" fill="rgba(255,255,255,0.2)" font-weight="700">SOBREVIURE</text>
  <text x="755" y="548" font-size="14" fill="rgba(255,255,255,0.2)" font-weight="700">CATALÀ</text>

  <!-- Dark semi-transparent overlay on entire hero -->
  <rect x="0" y="63" width="1440" height="645" fill="rgba(15,25,35,0.55)"/>

  <!-- Cat emoji centered -->
  <text x="720" y="220" font-size="52" text-anchor="middle">🐱</text>

  <!-- Hero headline -->
  <text x="720" y="310" font-size="64" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1.5" font-family="Georgia, serif">Samarretes catalanes</text>
  <text x="720" y="385" font-size="64" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1.5" font-family="Georgia, serif">amb un toc diferent</text>

  <!-- Subheadline -->
  <text x="720" y="440" font-size="20" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="0.3">per dibuixar-te un somriure</text>

  <!-- CTA buttons -->
  <rect x="498" y="472" width="264" height="54" rx="27" fill="white"/>
  <text x="630" y="505" font-size="15" fill="#1a2e3b" text-anchor="middle" font-weight="700">Descobreix les samarretes</text>

  <rect x="784" y="472" width="210" height="54" rx="27" fill="none" stroke="white" stroke-width="2"/>
  <text x="889" y="505" font-size="15" fill="white" text-anchor="middle" font-weight="700">La nostra història</text>

  <!-- Scroll indicator -->
  <text x="720" y="598" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="2.5" font-weight="600">DESCOBREIX MÉS</text>
  <!-- Down arrow -->
  <polyline points="710,612 720,624 730,612" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== BOTTOM COLORED STRIPE (senyera colors) ===== -->
  <rect x="0" y="708" width="360" height="9" fill="#c00"/>
  <rect x="360" y="708" width="360" height="9" fill="#f0b800"/>
  <rect x="720" y="708" width="360" height="9" fill="#c00"/>
  <rect x="1080" y="708" width="360" height="9" fill="#f0b800"/>

  <!-- ===== TRUST BAR ===== -->
  <rect x="0" y="717" width="1440" height="103" fill="#faf8ee"/>

  <!-- Trust item 1: Enviament gratuït -->
  <circle cx="186" cy="764" r="24" fill="#f0b800" opacity="0.25"/>
  <circle cx="186" cy="764" r="18" fill="#f0b800"/>
  <text x="186" y="770" font-size="16" text-anchor="middle">🚚</text>
  <text x="226" y="756" font-size="14" fill="#1a2e3b" font-weight="700">Enviament gratuït</text>
  <text x="226" y="775" font-size="12" fill="#6a7a80">A partir de 50€ als Països Catalans</text>

  <!-- Trust item 2: 30 dies -->
  <circle cx="546" cy="764" r="24" fill="#f0b800" opacity="0.25"/>
  <circle cx="546" cy="764" r="18" fill="#f0b800"/>
  <text x="546" y="770" font-size="16" text-anchor="middle">↩</text>
  <text x="586" y="756" font-size="14" fill="#1a2e3b" font-weight="700">30 dies per tornar</text>
  <text x="586" y="775" font-size="12" fill="#6a7a80">Devolucions sense preguntes</text>

  <!-- Trust item 3: Cotó orgànic -->
  <circle cx="906" cy="764" r="24" fill="#f0b800" opacity="0.25"/>
  <circle cx="906" cy="764" r="18" fill="#f0b800"/>
  <text x="906" y="770" font-size="16" text-anchor="middle">🌿</text>
  <text x="946" y="756" font-size="14" fill="#1a2e3b" font-weight="700">Cotó orgànic GOTS</text>
  <text x="946" y="775" font-size="12" fill="#6a7a80">Certificació internacional</text>

  <!-- Trust item 4: Pagament segur -->
  <circle cx="1254" cy="764" r="24" fill="#f0b800" opacity="0.25"/>
  <circle cx="1254" cy="764" r="18" fill="#f0b800"/>
  <text x="1254" y="770" font-size="16" text-anchor="middle">🔒</text>
  <text x="1294" y="756" font-size="14" fill="#1a2e3b" font-weight="700">Pagament segur</text>
  <text x="1294" y="775" font-size="12" fill="#6a7a80">Stripe SSL protegit</text>

</svg>
