<svg width="1440" height="820" viewBox="0 0 1440 820" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <!-- ===== NAV ===== -->
  <rect width="1440" height="62" fill="#faf8ee"/>
  <line x1="0" y1="62" x2="1440" y2="62" stroke="#e8e2cc" stroke-width="1"/>

  <!-- Logo: GATAMAGAT CAT -->
  <text x="72" y="42" font-size="26" font-weight="900" fill="#1a2e3b" letter-spacing="-0.5" font-family="Georgia, serif">GAT</text>
  <text x="127" y="42" font-size="26" font-weight="900" fill="#f0b800" letter-spacing="-0.5" font-family="Georgia, serif">A</text>
  <text x="147" y="42" font-size="26" font-weight="900" fill="#1a2e3b" letter-spacing="-0.5" font-family="Georgia, serif">MAGAT</text>
  <text x="258" y="42" font-size="17" font-weight="700" fill="#1a2e3b" letter-spacing="1" font-family="Georgia, serif">CAT</text>

  <!-- Nav links centered -->
  <text x="560" y="40" font-size="13.5" fill="#1a2e3b" font-weight="700" letter-spacing="0.5">BOTIGA</text>
  <text x="631" y="40" font-size="10" fill="#1a2e3b">▾</text>
  <text x="660" y="40" font-size="13.5" fill="#1a2e3b" font-weight="700" letter-spacing="0.5">BLOG</text>
  <text x="718" y="40" font-size="13.5" fill="#1a2e3b" font-weight="700" letter-spacing="0.5">NOSALTRES</text>
  <text x="830" y="40" font-size="13.5" fill="#1a2e3b" font-weight="700" letter-spacing="0.5">CONTACTE</text>

  <!-- Right icons -->
  <!-- Instagram icon -->
  <rect x="1260" y="18" width="24" height="24" rx="6" fill="none" stroke="#1a2e3b" stroke-width="1.5"/>
  <circle cx="1272" cy="30" r="5" fill="none" stroke="#1a2e3b" stroke-width="1.5"/>
  <circle cx="1279" cy="23" r="1.5" fill="#1a2e3b"/>
  <!-- Search icon -->
  <circle cx="1310" cy="29" r="7" fill="none" stroke="#1a2e3b" stroke-width="1.5"/>
  <line x1="1315" y1="34" x2="1322" y2="41" stroke="#1a2e3b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- User icon -->
  <circle cx="1351" cy="25" r="5" fill="none" stroke="#1a2e3b" stroke-width="1.5"/>
  <path d="M1340 42c0-6 5-9 11-9s11 3 11 9" fill="none" stroke="#1a2e3b" stroke-width="1.5"/>
  <!-- Cart icon -->
  <path d="M1382 22h-4l-4 14h18l-4-14h-4" fill="none" stroke="#1a2e3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1382" cy="39" r="2" fill="#1a2e3b"/>
  <circle cx="1390" cy="39" r="2" fill="#1a2e3b"/>
  <!-- Cart badge -->
  <circle cx="1396" cy="20" r="7" fill="#f0b800"/>
  <text x="1396" y="24" font-size="9" fill="#1a2e3b" text-anchor="middle" font-weight="700">1</text>

  <!-- ===== HERO: photo collage grid with dark overlay ===== -->
  <!-- Grid background: 4x2 of photo rectangles -->
  <!-- Row 1 -->
  <rect x="0" y="63" width="360" height="355" fill="#4a5a6a"/>
  <rect x="360" y="63" width="360" height="355" fill="#3a4a52"/>
  <rect x="720" y="63" width="360" height="355" fill="#5a6a74"/>
  <rect x="1080" y="63" width="360" height="355" fill="#4a5060"/>
  <!-- Row 2 -->
  <rect x="0" y="418" width="360" height="290" fill="#3d4a56"/>
  <rect x="360" y="418" width="360" height="290" fill="#4e5a68"/>
  <rect x="720" y="418" width="360" height="290" fill="#3a4e5a"/>
  <rect x="1080" y="418" width="360" height="290" fill="#506070"/>

  <!-- Subtle photo content hints (silhouettes/shapes) -->
  <!-- Person with socks (top left) -->
  <ellipse cx="180" cy="260" rx="50" ry="80" fill="rgba(200,180,150,0.3)"/>
  <rect x="140" y="320" width="30" height="80" fill="rgba(240,200,80,0.5)" rx="4"/>
  <rect x="185" y="320" width="30" height="80" fill="rgba(240,200,80,0.5)" rx="4"/>

  <!-- T-shirt text glimpse (top right) -->
  <text x="1160" y="250" font-size="28" font-weight="900" fill="rgba(255,255,255,0.25)" transform="rotate(-5,1160,250)">CATALA</text>

