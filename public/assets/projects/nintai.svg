  <text x="940" y="535" font-size="12" fill="rgba(255,255,255,0.8)">El proper termini és el 20 d'octubre. 📅</text>
  <text x="830" y="566" font-size="10" fill="rgba(255,255,255,0.4)">jul_IA_ · Assessora virtual de Nintai</text>

